# --- QMIX specific parameters ---
# Settings used for every QMIX run in the paper. epsilon_anneal_time differs
# per benchmark and is passed on the command line (see run_experiment.py).

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

mac: "basic_mac"
runner: "parallel"
batch_size_run: 10

buffer_size: 5000

# update the target network every {} episodes
target_update_interval_or_tau: 200


obs_agent_id: True
obs_last_action: False
obs_individual_obs: False


# use the Q_Learner to train
standardise_returns: False
standardise_rewards: True

agent_output_type: "q"
learner: "q_learner"
double_q: True
mixer: "qmix"
use_rnn: True
hidden_dim: 128
lr: 0.0003
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

name: "qmix"
